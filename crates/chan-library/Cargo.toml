[package]
name = "chan-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The chan library: the authoritative window/terminal/workspace lifecycle (the source of truth clients reconcile to)."
publish = false

[lib]
name = "chan_library"

[features]
# Test-only items compiled for downstream test builds: the terminal registry's
# `Registry::attach`/`len`/`is_empty` helpers and its output injector
# `Registry::inject_output`, the attach seam (`AttachSeam`, `arm_attach_seam`)
# that runs a test hook at a ring-lock boundary of an attach or an output, and
# `WorkspaceHost::test_connect_window_presence` and
# `TenantTaskOwner::task_count`. chan-server's tests (lib.rs,
# routes/terminal.rs, routes/library_command_capability_tests.rs) use all but
# `len`/`is_empty`, so they enable this in their dev-dependency; production
# builds never see these items.
test-util = []

[dependencies]
# The filesystem/registry core. default-features off (no embeddings: the host
# owns lifecycle, not search -- chan-server forwards embeddings through its own
# feature when it builds chan-workspace).
chan-workspace = { workspace = true, default-features = false }
# Control-socket wire types (`ControlRequest`/`ControlResponse`); default-features
# off drops the clap-backed `cs` client, same as chan-server.
chan-shell = { workspace = true }
# Reverse-tunnel registry (`cs tunnel`). The host owns the one registry both
# WebSocket legs and the control-socket handler meet at; default-features off
# (the desktop-side dialing client stays out of the server stack).
chan-revtunnel = { workspace = true }
chan-systemd = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
dirs = { workspace = true }
filedescriptor = { workspace = true }
portable-pty = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `terminal.profiles` is an array-of-tables, a shape only TOML has. The struct
# is loaded from server.toml in production, so the schema tests parse the real
# format rather than a JSON stand-in that could not catch a `[[profiles]]`
# mistake.
toml = { workspace = true }
# The shutdown-grace test runs on a paused tokio clock
# (`#[tokio::test(start_paused = true)]`) so the grace bound holds exactly on a
# loaded host; `start_paused` lives behind tokio's own `test-util` feature.
tokio = { workspace = true, features = ["test-util"] }
