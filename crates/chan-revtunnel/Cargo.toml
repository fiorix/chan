[package]
name = "chan-revtunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reverse port forwarding from a chan devserver to a connected chan-desktop"

[features]
# The desktop half (listener + WebSocket dialer) pulls a WS client stack the
# devserver half must not link, so it is a feature. On by default because both
# the desktop shell and the end-to-end harness want it; chan-server takes this
# crate with `default-features = false` and gets only the wire contract, the
# spec parser, and the byte pumps.
default = ["client"]
client = ["dep:tokio-tungstenite", "dep:futures"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

futures = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
