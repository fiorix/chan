<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Echo extension</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-monospace, monospace; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #11151b;
        color: #e8edf4;
      }
      main {
        width: min(36rem, calc(100vw - 3rem));
        padding: 2rem;
        border: 1px solid #344050;
        border-radius: 0.75rem;
        background: #171d25;
      }
      label { display: block; margin-bottom: 0.6rem; color: #aab7c7; }
      input {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border: 1px solid #52647a;
        border-radius: 0.4rem;
        background: #0e1217;
        color: inherit;
        font: inherit;
      }
      input:focus { outline: 2px solid #62d6a8; outline-offset: 2px; }
      output {
        display: block;
        min-height: 1.5rem;
        margin-top: 1.25rem;
        color: #62d6a8;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <label for="echo-input">Type something</label>
      <input id="echo-input" type="text" autocomplete="off" autofocus>
      <output id="echo-output" for="echo-input" aria-live="polite"></output>
      <section aria-label="Capture exercise">
        <p id="capture-sources">Microphone: unknown</p>
        <p>
          <button id="capture-open" type="button">Open capture</button>
          <button id="capture-stop" type="button">Stop</button>
          <button id="capture-cancel" type="button">Cancel</button>
        </p>
        <output id="capture-state" aria-live="polite"></output>
        <ul id="capture-takes"></ul>
      </section>
    </main>
    <script>
      const input = document.querySelector("#echo-input");
      const output = document.querySelector("#echo-output");
      input.addEventListener("input", () => { output.textContent = input.value; });

      // The keyboard relay. Chan advertises the shell chords it claims as
      // key tokens: the letter or punctuation symbol the layout types, the
      // top-row digit by position, or a named key such as Enter, each with
      // its exact modifiers. This frame resolves a keydown the same way,
      // relays a match with its raw fields, and Chan resolves and checks it
      // again before acting on it.
      const SHIFTED = new Map([
        ["~", "`"], ["{", "["], ["}", "]"], ["<", ","], ["+", "="],
        ["_", "-"], [">", "."], [":", ";"], ["?", "/"],
      ]);
      const PUNCTUATION = new Set(["`", "[", "]", ",", "=", "-", ".", ";", "/"]);
      const POSITIONS = new Map([
        ["Backquote", "`"], ["BracketLeft", "["], ["BracketRight", "]"],
        ["Comma", ","], ["Equal", "="], ["Minus", "-"], ["Period", "."],
        ["Semicolon", ";"], ["Slash", "/"],
      ]);
      const MODIFIERS = new Set(["Shift", "Alt", "Control", "Meta", "AltGraph", "Unidentified"]);
      const mac = /Mac OS X|Macintosh/.test(navigator.userAgent);

      // A lone modifier, an Unidentified key, an IME composition, a dead key
      // outside the Option fallback and AltGr character entry off macOS name no
      // chord; a Ctrl+Alt keydown flagged AltGraph whose key is still a plain
      // letter or digit typed nothing and stays a chord (Windows reports AltGr
      // as Ctrl+Alt). Option
      // on macOS replaces the key with a glyph or a dead key, so only then
      // does the physical position decide.
      function shortcutKey(event) {
        const k = event.key;
        if (!k || MODIFIERS.has(k) || event.isComposing || k === "Process") return null;
        const altGrTypedNothing =
          event.ctrlKey && event.altKey && /^[a-z0-9]$/i.test(k);
        if (!mac && event.getModifierState("AltGraph") && !altGrTypedNothing) return null;
        const digit = /^Digit([0-9])$/.exec(event.code);
        if (digit) return { key: digit[1], shifted: false, consumable: false };
        if (/^[a-z]$/i.test(k)) return { key: k.toUpperCase(), shifted: false, consumable: false };
        if (PUNCTUATION.has(k)) return { key: k, shifted: false, consumable: true };
        if (SHIFTED.has(k)) return { key: SHIFTED.get(k), shifted: true, consumable: false };
        if (event.altKey) {
          const letter = /^Key([A-Z])$/.exec(event.code);
          if (letter) return { key: letter[1], shifted: false, consumable: false };
          if (POSITIONS.has(event.code)) {
            return { key: POSITIONS.get(event.code), shifted: false, consumable: false };
          }
        }
        if (k === "Dead") return null;
        return { key: k.length === 1 ? k.toUpperCase() : k, shifted: false, consumable: false };
      }

      // The exact chord, or the same chord without a Shift that only typed
      // a punctuation symbol.
      function claimed(event) {
        const id = shortcutKey(event);
        if (!id) return false;
        const matches = (key, shiftKey) =>
          key?.key === id.key &&
          key.ctrlKey === event.ctrlKey &&
          key.altKey === event.altKey &&
          key.metaKey === event.metaKey &&
          key.shiftKey === shiftKey;
        return hostKeys.some((key) =>
          matches(key, event.shiftKey || id.shifted) ||
          (event.shiftKey && id.consumable && matches(key, false))
        );
      }

      // The capture exercise. Open only arms the host bar; the viewer
      // starts the take there. Takes are listed by id and acked from the
      // list, and a redelivered take replaces its row instead of adding one.
      const captureSources = document.querySelector("#capture-sources");
      const captureState = document.querySelector("#capture-state");
      const captureTakes = document.querySelector("#capture-takes");
      const takes = new Map();
      let captureRequest = 0;
      let activeRequest = null;
      function postCapture(message) {
        window.parent.postMessage({ type: "chan:extension-capture-request:v1", ...message }, "*");
      }
      document.querySelector("#capture-open").addEventListener("click", () => {
        captureRequest += 1;
        activeRequest = `echo-${captureRequest}`;
        postCapture({ action: "open", request_id: activeRequest, source: "microphone" });
      });
      document.querySelector("#capture-stop").addEventListener("click", () => {
        if (activeRequest) postCapture({ action: "stop", request_id: activeRequest });
      });
      document.querySelector("#capture-cancel").addEventListener("click", () => {
        if (activeRequest) postCapture({ action: "cancel", request_id: activeRequest });
      });
      function showTake(take) {
        takes.set(take.take_id, take);
        captureTakes.replaceChildren(...[...takes.values()].map((item) => {
          const row = document.createElement("li");
          row.textContent = `${item.take_id} ${item.mime || "unknown type"} ${item.bytes} bytes `;
          const ack = document.createElement("button");
          ack.type = "button";
          ack.textContent = "Ack";
          ack.addEventListener("click", () => {
            postCapture({ action: "ack", take_id: item.take_id });
            takes.delete(item.take_id);
            row.remove();
          });
          row.append(ack);
          return row;
        }));
      }
      window.parent.postMessage({ type: "chan:extension-ready:v1" }, "*");

      let hostKeys = [];
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.type === "chan:extension-capture-sources:v1") {
          captureSources.textContent = `Microphone: ${event.data.sources?.microphone ?? "unknown"}`;
          return;
        }
        if (event.data?.type === "chan:extension-capture-event:v1") {
          const state = event.data;
          captureState.textContent = state.state === "error"
            ? `error: ${state.code}`
            : state.state === "cancelled"
              ? `cancelled by ${state.by}`
              : state.state;
          if (state.state === "take") showTake(state);
          return;
        }
        if (event.data?.type !== "chan:extension-host-keymap:v2") return;
        if (!Array.isArray(event.data.keys)) return;
        hostKeys = event.data.keys;
      });
      window.addEventListener("keydown", (event) => {
        if (!claimed(event)) return;
        event.preventDefault();
        event.stopPropagation();
        window.parent.postMessage({
          type: "chan:extension-keydown:v2",
          key: event.key,
          code: event.code,
          ctrlKey: event.ctrlKey,
          altKey: event.altKey,
          metaKey: event.metaKey,
          shiftKey: event.shiftKey,
          repeat: event.repeat,
          isComposing: event.isComposing,
          altGraph: event.getModifierState("AltGraph"),
        }, "*");
      }, true);
    </script>
  </body>
</html>
