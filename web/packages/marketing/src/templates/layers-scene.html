<div class="tour-scene" aria-hidden="true">
  <div class="scene-world">
    <div class="scene-layer scene-computers">
      <i class="scene-ground"></i>
      <i class="scene-route is-east"></i>
      <i class="scene-route is-north"></i>
      <i class="scene-route is-far"></i>
      <i class="scene-pad is-here"></i>
      <i class="scene-pad is-east"></i>
      <i class="scene-pad is-back"></i>
      <i class="scene-pad is-north is-ghost"></i>
      <i class="scene-gate is-north"></i>
      <span class="scene-farlib is-east"><i></i><i></i><i></i><i></i></span>
      <span class="scene-farlib is-back"><i></i><i></i><i></i><i></i></span>
      <span class="scene-tag is-route is-east" data-from="devserver">ssh</span>
      <span class="scene-tag is-route is-north" data-from="gateway">OAuth2 sign-in</span>
      <span class="scene-tag is-route is-far" data-from="gateway">dials out</span>
      <span class="scene-tag is-caption is-here" data-from="desktop">Local machine</span>
      <span class="scene-tag is-caption is-east" data-from="devserver">Devserver</span>
      <span class="scene-tag is-caption is-back" data-from="gateway">Devserver</span>
      <span class="scene-tag is-caption is-north is-gate" data-from="gateway">Gateway you host</span>
    </div>
    <div class="scene-layer scene-library">
      <i class="scene-lib"></i>
      <i class="scene-tile is-a"></i><i class="scene-tile is-b"></i><i class="scene-tile is-c"></i><i class="scene-tile is-d"></i>
      <i class="scene-post is-nw"></i><i class="scene-post is-ne"></i><i class="scene-post is-se"></i><i class="scene-post is-sw"></i>
      <i class="scene-miniwin"></i><i class="scene-miniwin is-d"></i>
      <span class="scene-tag is-layer is-library" data-at="library desktop">Library</span>
      <span class="scene-tag is-caption is-workspace" data-at="library desktop">Workspace</span>
    </div>
    <div class="scene-layer scene-window">
      <div class="shot-win"><img class="shot" src="/assets/home/tour/files-wide.webp" alt="" loading="lazy" /></div>
      <span class="scene-tag is-layer is-window" data-at="library desktop">Window</span>
    </div>
  </div>
</div>
