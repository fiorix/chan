<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="icon" type="image/png" href="/chan-favicon.png" />
<link rel="apple-touch-icon" href="/chan-favicon.png" />
<link rel="stylesheet" href="/assets/site.css" />
<link rel="stylesheet" href="/assets/site-motion.css" />
<script type="module" src="/assets/site-motion.js"></script>
<script src="/assets/site.js" defer></script>
{{headExtra}}
</head>
<body class="{{bodyClass}}" data-mode="dark">
<div class="site-shell">
  <div class="site-background" aria-hidden="true">
    <div class="site-grid"></div>
    <div class="site-atmosphere" data-site-animation="{{backgroundAnimation}}"></div>
  </div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Chan home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>chan</span>
    </a>
    <nav class="site-nav" aria-label="Site">
        {{siteNav}}
    </nav>
  </header>

  <main>
{{content}}
  </main>

  <footer class="site-footer">
    <span>Chan is free, open source software. Made with love.</span>
    <span>© 2026 chan.app</span>
  </footer>
</div>
</body>
</html>
