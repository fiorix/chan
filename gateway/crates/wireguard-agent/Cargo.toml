[package]
name = "wireguard-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Keeps a proxy host's kernel WireGuard peers equal to the gateway's peer table."

[[bin]]
name = "wireguard-agent-service"
path = "src/main.rs"

[dependencies]
devserver-control-proto = { workspace = true }
gateway-common = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
wiremock = "0.6"

[package.metadata.deb]
name = "chan-gateway-wireguard-agent"
maintainer = "fiorix <fiorix@gmail.com>"
copyright = "2026, fiorix <fiorix@gmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Proxy-host agent for the chan-gateway suite. It keeps one kernel WireGuard
interface's peers equal to the gateway's peer table for this host, read
from identity's internal listener and applied with wg from
wireguard-tools, and adds and removes only the peers it added itself.
The interface is the operator's; no listener, database or metrics
endpoint lives in this binary."""
section = "net"
priority = "optional"
depends = "$auto, adduser, wireguard-tools"
maintainer-scripts = "packaging/"
assets = [
    ["target/release/wireguard-agent-service", "/usr/bin/chan-gateway-wireguard-agent", "755"],
    ["packaging/wireguard-agent.env",           "/etc/chan-gateway/wireguard-agent.env",  "640"],
]
conf-files = ["/etc/chan-gateway/wireguard-agent.env"]

[package.metadata.deb.systemd-units]
unit-name = "chan-gateway-wireguard-agent"
unit-scripts = "packaging/"
enable = false
start = false
