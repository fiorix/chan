[[set]]
identifier = "main-window"
description = "Defines reload, devtools, zoom, and update-restart commands for local app content in main and main-* windows; the loopback launcher uses separate remote-scoped capabilities."
permissions = [
  "allow-reload-window",
  "allow-open-devtools",
  "allow-zoom-in",
  "allow-zoom-out",
  "allow-zoom-reset",
  "allow-restart-desktop-after-update",
]

[[set]]
identifier = "workspace-window"
description = "Allows per-workspace windows to call their app commands."
permissions = [
  "allow-reload-window",
  "allow-open-devtools",
  "allow-open-new-window",
  "allow-request-app-quit",
  "allow-request-close-window",
  "allow-hide-window-from-close-confirm",
  "allow-abandon-devserver-for-window",
  "allow-reconnect-devserver-for-window",
  "allow-zoom-in",
  "allow-zoom-out",
  "allow-zoom-reset",
  "allow-probe-url",
  "allow-platform-os",
  "allow-read-clipboard-text",
  "allow-write-clipboard-text",
  "allow-read-clipboard-image",
  "allow-write-clipboard-image",
  "allow-read-clipboard-html",
  "allow-write-clipboard-html",
  "allow-open-reverse-tunnel",
  "allow-create-library-window",
  "allow-focus-library-window",
  "allow-native-vocabulary",
]

# The gateway-window set is workspace-window without allow-probe-url. The
# bundled connecting screen is a local app page, so it reaches probe_url through
# the workspace capability's workspace-window grant; a remotely served gateway
# lib-* window must not receive probe_url.
[[set]]
identifier = "gateway-window"
description = "Allows authenticated gateway-served lib-* windows to call their app commands."
permissions = [
  "allow-reload-window",
  "allow-open-devtools",
  "allow-open-new-window",
  "allow-request-app-quit",
  "allow-request-close-window",
  "allow-hide-window-from-close-confirm",
  "allow-abandon-devserver-for-window",
  "allow-reconnect-devserver-for-window",
  "allow-zoom-in",
  "allow-zoom-out",
  "allow-zoom-reset",
  "allow-platform-os",
  "allow-read-clipboard-text",
  "allow-write-clipboard-text",
  "allow-read-clipboard-image",
  "allow-write-clipboard-image",
  "allow-read-clipboard-html",
  "allow-write-clipboard-html",
  "allow-open-reverse-tunnel",
  "allow-create-library-window",
  "allow-focus-library-window",
  "allow-native-vocabulary",
]

[[permission]]
identifier = "allow-reload-window"
description = "Enables the reload_window command."
commands.allow = ["reload_window"]

[[permission]]
identifier = "allow-open-devtools"
description = "Enables the open_devtools command."
commands.allow = ["open_devtools"]

[[permission]]
identifier = "allow-open-new-window"
description = "Enables the open_new_window command (KEY_BRIDGE_JS New Window chord on menu-less windows)."
commands.allow = ["open_new_window"]

[[permission]]
identifier = "allow-request-app-quit"
description = "Enables the request_app_quit command (KEY_BRIDGE_JS Quit chord on menu-less windows)."
commands.allow = ["request_app_quit"]

[[permission]]
identifier = "allow-request-close-window"
description = "Enables the request_close_window command."
commands.allow = ["request_close_window"]

[[permission]]
identifier = "allow-hide-window-from-close-confirm"
description = "Enables the hide_window_from_close_confirm command (close-confirm overlay Hide)."
commands.allow = ["hide_window_from_close_confirm"]

[[permission]]
identifier = "allow-abandon-devserver-for-window"
description = "Enables the abandon_devserver_for_window command (disconnect overlay Abandon)."
commands.allow = ["abandon_devserver_for_window"]

[[permission]]
identifier = "allow-reconnect-devserver-for-window"
description = "Enables the reconnect_devserver_for_window command (disconnect overlay Reconnect)."
commands.allow = ["reconnect_devserver_for_window"]

[[permission]]
identifier = "allow-zoom-in"
description = "Enables the zoom_in command."
commands.allow = ["zoom_in"]

[[permission]]
identifier = "allow-zoom-out"
description = "Enables the zoom_out command."
commands.allow = ["zoom_out"]

[[permission]]
identifier = "allow-zoom-reset"
description = "Enables the zoom_reset command."
commands.allow = ["zoom_reset"]

[[permission]]
identifier = "allow-probe-url"
description = "Enables the probe_url command."
commands.allow = ["probe_url"]

[[permission]]
identifier = "allow-platform-os"
description = "Enables the platform_os command."
commands.allow = ["platform_os"]

[[permission]]
identifier = "allow-read-clipboard-text"
description = "Enables the read_clipboard_text command."
commands.allow = ["read_clipboard_text"]

[[permission]]
identifier = "allow-write-clipboard-text"
description = "Enables the write_clipboard_text command (OSC 52 terminal copy)."
commands.allow = ["write_clipboard_text"]

[[permission]]
identifier = "allow-read-clipboard-image"
description = "Enables the read_clipboard_image command."
commands.allow = ["read_clipboard_image"]

[[permission]]
identifier = "allow-write-clipboard-image"
description = "Enables the write_clipboard_image command."
commands.allow = ["write_clipboard_image"]

[[permission]]
identifier = "allow-read-clipboard-html"
description = "Enables the read_clipboard_html command."
commands.allow = ["read_clipboard_html"]

[[permission]]
identifier = "allow-write-clipboard-html"
description = "Enables the write_clipboard_html command."
commands.allow = ["write_clipboard_html"]

[[permission]]
identifier = "allow-open-reverse-tunnel"
description = "Enables the open_reverse_tunnel command (the cs tunnel trigger; the devserver to dial resolves from the invoking window's own connection)."
commands.allow = ["open_reverse_tunnel"]

# IN the workspace-window and gateway-window sets on purpose, unlike
# allow-gateway-csrf-token below. Both commands resolve their target library
# from the INVOKING window's own label, so a window can only ever reach its own
# library, and every window class that runs the command deck needs them: a
# loopback window gets them through capabilities/workspace.json, and an
# authenticated exact-origin gateway lib-* window gets them through the
# runtime-minted gateway-window set.
[[permission]]
identifier = "allow-create-library-window"
description = "Enables the create_library_window command (the command deck's native library-window mint)."
commands.allow = ["create_library_window"]

[[permission]]
identifier = "allow-focus-library-window"
description = "Enables the focus_library_window command (raise a window of the caller's own library)."
commands.allow = ["focus_library_window"]

[[permission]]
identifier = "allow-native-vocabulary"
description = "Enables the native_vocabulary command (the granted command list plus build identity, so a remotely-served page can learn what is available instead of discovering absence through a refusal)."
commands.allow = ["native_vocabulary"]

# Deliberately NOT in the workspace-window set: only an authenticated exact
# gateway origin needs the native mirror, and the runtime-minted capability is
# the authority that binds that origin to its lib-* windows.
[[permission]]
identifier = "allow-gateway-csrf-token"
description = "Enables an exact-origin gateway window to read its current CSRF token."
commands.allow = ["gateway_csrf_token"]

# Deliberately NOT in the workspace-window set: the macOS drag
# pasteboard is system-wide, so this is granted only to locally-served windows
# via capabilities/local-drop.json, never to devserver-served `lib-*` webviews
# (loopback or gateway).
[[permission]]
identifier = "allow-read-dropped-paths"
description = "Enables the read_dropped_paths command (drag-pasteboard read at drop time)."
commands.allow = ["read_dropped_paths"]

# Deliberately NOT in the workspace-window set: native transfers read or write
# the user's local filesystem, so every command is granted only to locally
# served windows plus authenticated exact gateway origins.
[[permission]]
identifier = "allow-download-file-native"
description = "Streams a same-origin authenticated download to the Downloads folder."
commands.allow = ["download_file_native"]

[[permission]]
identifier = "allow-upload-files-native"
description = "Picks local regular files and streams them to the same-origin upload API."
commands.allow = ["upload_files_native"]

[[permission]]
identifier = "allow-native-transfer-status"
description = "Reads bounded native transfer progress."
commands.allow = ["native_transfer_status"]

[[permission]]
identifier = "allow-cancel-native-transfer"
description = "Cancels one opaque native transfer id."
commands.allow = ["cancel_native_transfer"]

[[permission]]
identifier = "allow-begin-generated-download"
description = "Begins a bounded chunk sink for SPA-generated download bytes."
commands.allow = ["begin_generated_download"]

[[permission]]
identifier = "allow-append-generated-download"
description = "Appends one bounded chunk to an SPA-generated download."
commands.allow = ["append_generated_download"]

[[permission]]
identifier = "allow-finish-generated-download"
description = "Atomically commits an SPA-generated download."
commands.allow = ["finish_generated_download"]

[[permission]]
identifier = "allow-cancel-generated-download"
description = "Cancels and cleans an SPA-generated download."
commands.allow = ["cancel_generated_download"]

[[permission]]
identifier = "allow-restart-desktop-after-update"
description = "Enables the restart_desktop_after_update command from the launcher update-ready dialog."
commands.allow = ["restart_desktop_after_update"]
