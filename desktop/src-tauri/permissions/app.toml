[[set]]
identifier = "main-window"
description = "Allows the launcher window to call Chan Desktop app commands."
permissions = [
  "allow-list-workspaces",
  "allow-add-workspace",
  "allow-remove-workspace",
  "allow-set-workspace-on",
  "allow-get-config",
  "allow-home-dir",
  "allow-reveal-in-finder",
  "allow-reload-window",
  "allow-open-devtools",
  "allow-zoom-in",
  "allow-zoom-out",
  "allow-zoom-reset",
  "allow-open-local-workspace",
  "allow-add-outbound-workspace",
  "allow-open-outbound-workspace",
  "allow-remove-outbound-workspace",
  "allow-auth-status",
  "allow-open-signin",
  "allow-signout",
  "allow-list-devserver-workspaces",
  "allow-reconnect-devserver",
  "allow-restart-desktop-after-update",
]

[[set]]
identifier = "workspace-window"
description = "Allows per-workspace windows to call their app commands."
permissions = [
  "allow-reload-window",
  "allow-open-devtools",
  "allow-open-new-window",
  "allow-request-app-quit",
  "allow-request-close-window",
  "allow-hide-window-from-close-confirm",
  "allow-abandon-devserver-for-window",
  "allow-reconnect-devserver-for-window",
  "allow-zoom-in",
  "allow-zoom-out",
  "allow-zoom-reset",
  "allow-probe-url",
  "allow-platform-os",
  "allow-read-clipboard-text",
  "allow-write-clipboard-text",
  "allow-read-clipboard-image",
  "allow-write-clipboard-image",
  "allow-read-clipboard-html",
  "allow-write-clipboard-html",
  "allow-open-reverse-tunnel",
  "allow-create-library-window",
  "allow-focus-library-window",
  "allow-native-vocabulary",
]

[[set]]
identifier = "hybrid-window"
description = "Allows the Hybrid host window to act as a window manager for chan windows: report which frames it holds and which one is focused, ask for a window to be closed, and set where the next window opens."
permissions = [
  "allow-hybrid-frames",
  "allow-hybrid-focus",
  "allow-hybrid-close-requested",
  "allow-hybrid-set-destination",
]

