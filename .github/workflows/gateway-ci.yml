name: Gateway CI

# The gateway (gateway/) is a separate nested Cargo workspace:
# Postgres-backed, server-side only (linux amd64/arm64), and NOT a
# member of the root chan workspace. ci.yml's Linux job runs the whole
# pre-push gate, gateway fmt, clippy, rustdoc, database-free tests,
# build and profile SPA checks included, but only this workflow runs
# the gateway's Postgres-backed integration tests (against a Postgres
# service) and builds the gateway containers.
#
# The path filter is the gateway's build input set, not gateway/ alone.
# gateway/Cargo.toml consumes crates/chan-tunnel-{client,proto,server}
# from the root workspace by path, and those crates take their version
# and their dependency pins from the root Cargo.toml through
# `workspace = true`, so a change to any of them changes what this
# workspace compiles and what its integration tests exercise.
# scripts/check-build-matrix.py derives that closure from the manifests
# and fails when a crate it reaches is missing from either list below,
# which is why the two lists are identical. The rest are the shared
# inputs: the Makefile recipes, the toolchain pin, the web lock and the
# profile SPA the identity binary embeds, and the gateway Docker files.
# ci.yml ignores gateway/** and nothing else, so a gateway-only change
# runs this gate alone and a change under crates/chan-tunnel-* runs
# both, each for its own workspace.

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'crates/chan-tunnel-client/**'
      - 'crates/chan-tunnel-proto/**'
      - 'crates/chan-tunnel-server/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'web/package-lock.json'
      - 'web/package.json'
      - 'web/packages/profile/**'
      - 'packaging/docker/build.sh'
      - 'packaging/docker/gateway.Dockerfile'
      - 'packaging/docker/gateway.Dockerfile.dockerignore'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'crates/chan-tunnel-client/**'
      - 'crates/chan-tunnel-proto/**'
      - 'crates/chan-tunnel-server/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'web/package-lock.json'
      - 'web/package.json'
      - 'web/packages/profile/**'
      - 'packaging/docker/build.sh'
      - 'packaging/docker/gateway.Dockerfile'
      - 'packaging/docker/gateway.Dockerfile.dockerignore'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gateway gate (linux)
    runs-on: ubuntu-latest

    # Integration tests create a throwaway schema per test under
    # TEST_DATABASE_URL, so the database itself must already exist;
    # POSTGRES_DB seeds it. The pool cap (4/conn per service) plus the
    # pg_reaper keep the shared slot count in bounds under cargo's
    # parallel test runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chan
          POSTGRES_PASSWORD: chan
          POSTGRES_DB: chan_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://chan:chan@127.0.0.1:5432/chan_gateway_test

    steps:
      - uses: actions/checkout@v6
        with:
          path: chan

      - name: static packaging checks
        working-directory: chan
        run: make gateway-version-pin-check

      # The gateway has no rust-toolchain.toml of its own; it inherits
      # the repo-root pin. Copy it to the runner root so the toolchain
      # action installs the same channel CI uses for the core.
      - run: cp chan/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      # Single writer of the gateway workspace key, on main only, so branch
      # runs never evict it under the repository cache cap.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chan/gateway
          shared-key: gateway-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chan/web/package-lock.json

      - name: Build SPA + type-check
        # rust-embed bakes gateway/crates/identity/web/dist into the
        # identity binary at compile time, so the bundle MUST exist
        # before any cargo invocation that compiles identity.
        working-directory: chan/web
        run: |
          npm ci
          npm run build -w @chan/profile
          npm run check -w @chan/profile

      - name: fmt
        working-directory: chan/gateway
        run: cargo fmt --check

      # --locked on every cargo step, as in the Makefile's gateway recipes,
      # so a stale gateway/Cargo.lock fails at the first step that resolves
      # it, with cargo's own message, instead of re-resolving on the runner.
      - name: clippy
        working-directory: chan/gateway
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: doc
        working-directory: chan/gateway
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace

      - name: test
        working-directory: chan/gateway
        run: cargo test --locked

  containers:
    name: gateway containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: chan

      - uses: docker/setup-buildx-action@v4

      - run: make docker-gateway-build
        working-directory: chan
